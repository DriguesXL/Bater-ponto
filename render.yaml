services:
  - type: web
    name: sistema-controle-ponto
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CLIENT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: ponto-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DAILY_REPORT_CRON
        value: "0 20 * * 1-5"

databases:
  - name: ponto-postgres
    plan: free
